name: servi_taxi_tlax
description: "ServiTlax: cotiza y solicita transporte local en Tlaxiaco."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Archivos JSON con los datos de ejemplo (hasta que exista la API).
  assets:
    - assets/data/

  # Fuente Poppins incluida en la app (funciona sin internet).
  # Los 4 archivos .ttf deben existir en assets/fonts/ o la app no compila.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
